<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>팝업 이미지 추출</title>
<style>
  body { max-width: 42rem; margin: 3rem auto; padding: 0 1rem; font: 16px/1.6 system-ui, sans-serif; }
  textarea { box-sizing: border-box; width: 100%; height: 12rem; }
  img { max-width: 100%; }
</style>
<h1>팝업 이미지 추출</h1>
<p>원래 탭의 팝업 이미지를 읽어 빈 입력칸에 자동 입력합니다. 이미지를 바꾸면 다시 읽으며 직접 입력한 내용은 유지합니다. 입력완료 버튼은 직접 눌러 주세요.</p>
<p id="status" role="status">연결 중…</p>
<img id="preview" alt="추출한 팝업 이미지" hidden>
<h2>인식한 문자·숫자</h2>
<p id="ocr-status" role="status"></p>
<pre id="result" style="font-size: 2rem; white-space: pre-wrap; overflow-wrap: anywhere;"></pre>
<p>인식 결과는 이미지와 대조해 확인해 주세요.</p>
<p><label for="source">이미지 data URL</label></p>
<textarea id="source" readonly spellcheck="false"></textarea>
<script src="vendor/ocr/tesseract.min.js"></script>
<script src="capture-source.js"></script>
<script type="module" src="capture.js"></script>
</html>
