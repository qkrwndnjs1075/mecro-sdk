<!doctype html>
<meta charset="utf-8">
<title>OCR regression</title>
<h1>OCR regression</h1>
<pre id="results">Running…</pre>
<script type="module">
import {ort} from '../extension/vendor/ocr/runtime.js';
import {recognizeImage} from '../extension/recognize-image.js';
import {createOCRWorker} from '../extension/ocr-worker.js';
window.chrome = {runtime:{getURL:path => new URL('../extension/'+path, location.href).href}};
const results = document.querySelector('#results');
let worker;
let inferenceCalls = 0;
const originalRun = ort.InferenceSession.prototype.run;
ort.InferenceSession.prototype.run = function(...args) {
  inferenceCalls++;
  return originalRun.apply(this, args);
};
try {
  worker = await createOCRWorker();
  const cases = [];
  const original = await (await fetch('fixtures/letter-confusion.json')).json();
  cases.push({name:'original-B-versus-E',source:original.source,expected:original.expected});
  const sloped = await (await fetch('fixtures/sloped-line.json')).json();
  cases.push({name:'sloped-line-screenshot',source:sloped.source,expected:sloped.expected});
  const extraLetter = await (await fetch('fixtures/extra-letter-original.json')).json();
  cases.push({name:'extra-letter-original',source:extraLetter.source,expected:extraLetter.expected});
  cases.push({name:'same-color-line',source:'fixtures/same-color-line.png',expected:'CDRWDD'});
  cases.push({name:'crossing-line',source:'fixtures/crossing-line.png',expected:'SXEERM'});
  const crossing = await (await fetch('fixtures/crossing-original.json')).json();
  cases.push({name:'crossing-original',source:crossing.source,expected:crossing.expected});
  for (const [name, expected] of [['previous', 'BLKPKU'], ['new', 'SRCNNS']]) {
    for (const scale of [1, 2]) cases.push({name: `${name}-${scale}`, source: `fixtures/${name}-${scale}.png`, expected});
  }
  for (const [background, ink, line] of [['white','black','red'], ['#241144','#44ddaa','#ffbb22'], ['#eeeedd','#223388','#bb3366']]) {
    const canvas = document.createElement('canvas'); canvas.width = 420; canvas.height = 100;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = background; ctx.fillRect(0, 0, 420, 100);
    ctx.fillStyle = ink; ctx.font = 'bold 48px Arial'; ctx.fillText('ABC123', 30, 70);
    ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(10, 46); ctx.lineTo(400, 46); ctx.stroke();
    cases.push({name: `synthetic-${background}`, source: canvas.toDataURL(), expected: 'ABC123'});
  }
  const blank = document.createElement('canvas');
  cases.push({name:'blank-image',source:blank.toDataURL(),expected:''});
  const report = [];
  for (const test of cases) {
    const start = performance.now();
    const before = inferenceCalls;
    const {data, usable} = await recognizeImage(worker, test.source);
    const recognitionCalls = inferenceCalls - before;
    const actual = data.text.trim();
    const automaticText = usable ? actual : '';
    report.push({name:test.name, expected:test.expected, actual, usable, automaticText, recognitionCalls,
      totalMs: Math.round(performance.now()-start),
      passed:recognitionCalls === 1 && (test.expected ? automaticText === test.expected : actual === '' && !usable)});
    results.textContent = JSON.stringify(report, null, 2);
  }
  document.body.dataset.result = report.every(row => row.passed) ? 'pass' : 'fail';
} catch (error) {
  results.textContent = error instanceof Error ? error.stack : String(error);
  document.body.dataset.result = 'error';
} finally {
  if (worker) await worker.terminate();
  ort.InferenceSession.prototype.run = originalRun;
}
</script>
